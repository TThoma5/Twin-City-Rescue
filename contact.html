<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Twin Cities Animal Rescue</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html">
        <img src="rescue-logo_c.png" alt="Twin Cities Animal Rescue logo">
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Contact Us</h1>
        <p>We would love to hear from you.</p>
      </div>
    </section>

    <section class="container">
      <h2>Get in Touch</h2>
      <p>Have questions about adoption, fostering, volunteering, or donations? Send us a message.</p>

      <p id="stored-interest-message" class="stored-interest-message" aria-live="polite"></p>

      <form id="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name">
          <span id="name-error" class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email">
          <span id="email-error" class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone">
          <span id="phone-error" class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="reason">Reason for Contact</label>
          <select id="reason" name="reason">
            <option value="">Select an option</option>
            <option value="adoption">Adoption</option>
            <option value="foster">Fostering</option>
            <option value="volunteer">Volunteering</option>
            <option value="donate">Donation</option>
            <option value="general">General Question</option>
          </select>
          <span id="reason-error" class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6"></textarea>
          <span id="message-error" class="error-message" aria-live="polite"></span>
        </div>

        <button type="submit">Send Message</button>
        <p id="form-success" class="form-success" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Twin Cities Animal Rescue. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
